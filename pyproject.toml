[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-assistant"
version = "0.1.0"
description = "Thai recipe RAG assistant: phidata + Ollama + pgvector, with a CLI and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "phidata>=2.4,<3",
    "streamlit>=1.35",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ollama>=0.3",             # used by phi.llm.ollama and phi.embedder.ollama
    "openai>=1.30",            # phidata imports it for its default embedder, even if unused
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",    # required by the postgresql+psycopg:// URL
    "pgvector>=0.2",
    "pypdf>=4.0",              # PDF parsing
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["pdf_assistant", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"